#
# rumdl config (Rust markdown linter). rumdl auto-discovers .rumdl.toml
# hierarchically, so .github/ and .changes/ extend this file instead of
# re-declaring the shared rules.
disable = ["MD013", "MD034", "MD060"]
# CHANGELOG.md and .changes/v*.md are generated by changie at release time;
# linting generated output is fragile (MD012 trailing blanks, MD041 first
# heading), so they are excluded. Hand-authored docs stay linted.
exclude = ["node_modules/", "CHANGELOG.md", ".changes/v*.md"]

[MD033]
allowed_elements = ["p", "a", "img"]

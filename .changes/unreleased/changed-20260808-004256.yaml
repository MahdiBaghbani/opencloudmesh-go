kind: changed
body: >-
  enable thelper, modernize, usetesting, and godoclint in golangci-lint and
  burn down their findings tree-wide; document the globally disabled linters
  (paralleltest, err113, goconst, funcorder) in docs/lint-policy.md with
  paralleltest framed as a structural integration-harness constraint
  (process-global chdir and env scrub at tests/integration/harness/subprocess.go)
  rather than a deferred-readiness waiver; add a lint-policy drift check (nu
  script plus CI step) that treats .golangci.yml as the single source of truth
  and fails when the generated disable-inventory block in docs/lint-policy.md
  drifts

kind: changed
body: >-
  ci and tooling polish: derive the lint-new base ref from the master
  merge-base (replacing the pinned SHA), consolidate the unreleased changelog,
  extend Dependabot to the uv ecosystem (gomod retained), switch the ci.yml
  rollup gate from always() to !cancelled(), pin hadolint with a SHA256-verified
  direct CI install and add hygiene pre-commit hooks for markdownlint, typos,
  hadolint, and yamllint, migrate the markdown linter from markdownlint-cli2 to
  rumdl with hierarchical .rumdl.toml config and a SHA256-verified CI install,
  rename the markdownlint workflow to rumdl, and document the unit, e2e, and
  fuzz CI wiring in docs/testing.md

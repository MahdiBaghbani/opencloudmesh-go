kind: changed
body: >-
  ci and tooling polish: pin a lint base-ref in the Makefile, consolidate
  the changelog, move Dependabot to uv, harden the ci.yml rollup with a parity
  invariant and a require-jobs gate, pin hadolint and add hygiene pre-commit
  hooks for markdownlint, typos, hadolint, and yamllint, migrate the markdown
  linter from markdownlint-cli2 to rumdl with hierarchical .rumdl.toml config
  and a SHA256-verified CI install, and document the unit, e2e, and fuzz CI
  wiring in docs/testing.md

kind: added
body: >-
  OCM federation notifications are now supported. A POST /ocm/notifications
  inbound handler accepts SHARE_ACCEPTED, SHARE_DECLINED, and SHARE_UNSHARED
  notifications over HTTP Message Signatures: ACCEPTED and DECLINED update the
  matching outgoing share's status (terminal, with sender-host authorization),
  and UNSHARED revokes local access on the matching incoming share. The inbox
  accept and decline flows now post a best-effort SHARE_ACCEPTED or
  SHARE_DECLINED notification to the original sender asynchronously when that
  peer advertises the notifications capability, without blocking the local
  response. The notifications capability is advertised in discovery.
  Experimental notification types are rejected. Outbound SHARE_UNSHARED is
  deferred.

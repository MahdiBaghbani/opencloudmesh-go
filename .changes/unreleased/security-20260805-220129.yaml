kind: security
body: >-
  CI workflow security hardening: pin every GitHub Action to an
  immutable commit SHA with a stale-pin freshness gate, add CodeQL SAST
  and go-licenses checks, container image attestations with trivy
  scanning, OpenSSF Scorecard posture, dependency-review, a scheduled
  fuzz job, and blocking hygiene linters (typos, yamllint, hadolint,
  shellcheck, markdownlint, actionlint), plus a security policy with
  private vulnerability reporting

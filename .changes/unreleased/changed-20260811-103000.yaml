kind: changed
body: >-
  The inbox verify-access endpoint no longer routes webapp shares through a
  dead selector that always failed with a confusing "access protocol must be
  webdav" error. Webapp shares now return an explicit 501
  unsupported_protocol before any remote access attempt, matching the
  advertised file-only contract. The discovery documentation for the
  must-invite criterion is also corrected: it is advertised and enforced by
  default and cleared by ocm.invite.enforce_must_invite=false, replacing the
  stale "omitted (not yet enforced)" wording.

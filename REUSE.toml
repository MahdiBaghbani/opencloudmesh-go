#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

# REUSE compliance manifest. Inline SPDX headers stay the source of truth
# for commentable files; this manifest covers files that cannot carry
# comments or are generated. Per the REUSE specification this file must
# live in the project root; a REUSE.toml only covers its own directory
# or deeper, and .reuse/ is reserved for tool-internal files.
version = 1
SPDX-PackageName = "opencloudmesh-go"
SPDX-PackageSupplier = "Mohammad Mahdi Baghbani Pourvahid <mahdi-baghbani@azadehafzar.io>"
SPDX-PackageDownloadLocation = "https://github.com/MahdiBaghbani/opencloudmesh-go"

[[annotations]]
path = [
  "**.crt",
  "**.key",
  "go.mod",
  "go.sum",
  "**.lock",
  "**/.gitkeep",
  ".gitignore",
  "**/.gitignore",
  ".dockerignore",
  "**/.dockerignore",
  ".python-version",
  "**.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mohammad Mahdi Baghbani Pourvahid <mahdi-baghbani@azadehafzar.io>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Changelog artifacts are generated by changie (`changie new` fragments,
# `changie batch` per-release notes, `changie merge` CHANGELOG.md) without
# per-file SPDX headers, and they aggregate contributions from many authors.
# Covered here under the project license with the collective holder so any
# contributor's entry is attributed to the project contributors, not to a
# single maintainer. header.md keeps its own inline SPDX but uses the same
# collective holder so the generated CHANGELOG.md is attributed correctly.
[[annotations]]
path = [
  ".changes/unreleased/**",
  ".changes/v*.md",
  "CHANGELOG.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "OpenCloudMesh Go contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Contributor-facing changelog reminder posted on PRs by the CI Changelog
# gate when a fragment is missing. Pure markdown (no inline SPDX) so the
# posted comment carries no license noise; attribution is aggregated here.
[[annotations]]
path = ".github/messages/changelog-reminder.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "OpenCloudMesh Go contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Vendored OCM-API OpenAPI snapshot (see vendor/pin.json): verbatim
# third-party IETF draft artifact; upstream declares no LICENSE file.
[[annotations]]
path = "internal/components/ocm/spec/vendor/spec.yaml"
precedence = "aggregate"
SPDX-FileCopyrightText = "IETF Trust and the persons identified as the document authors"
SPDX-License-Identifier = "LicenseRef-IETF-Trust"

# Sovereign Tech funder logos: external trademarks included only for
# funding acknowledgment. NOT AGPL and NOT project copyright. Each mark
# is attributed to its own owner explicitly; the funders tree is not
# blanket-attributed to a single holder. See LICENSES/LicenseRef-
# SovereignTech-Brand.txt for the brand terms and usage guidelines.
[[annotations]]
path = "assets/logos/funders/sovereign-tech-agency.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Sovereign Tech Agency"
SPDX-License-Identifier = "LicenseRef-SovereignTech-Brand"

[[annotations]]
path = "assets/logos/funders/sovereign-tech-fund.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Sovereign Tech Fund"
SPDX-License-Identifier = "LicenseRef-SovereignTech-Brand"

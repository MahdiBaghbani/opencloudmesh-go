# Curated comprehensive lint bar for opencloudmesh-go (OCM strict server).
#
# Version pin: golangci-lint v2.12.2 (audit toolchain; config verify exit 0).
#
# Enable/disable philosophy:
# - linters.default: all, then disable only documented noise buckets.
# - Correctness + security linters stay ON (errcheck explicit, gosec curated,
#   forcetypeassert, contextcheck, wastedassign, bodyclose, cyclop, etc.).
# - v3.1 operator decisions (A/B/C):
#     A. wsl_v5 ON (auto-fix via `make lint-fix`; accept churn). Old wsl OFF.
#     B. tagliatelle ON, json: camel (manual struct-tag churn; accept).
#     C. cyclop is the sole complexity linter (15 prod / 25 test). gocyclo OFF.
# - v2 has NO default exclusions: every exclusion is explicit (presets: []).
# - Do NOT use linters.exclusions.presets std-error-handling: it hides errcheck
#   Close/RemoveAll failures (~279 hits including prod HTTP clients).
#
# Bootstrap policy (not YAML keys):
# - CI: only-new-issues delta BLOCKS merges on new lint in touched lines.
# - Full-tree make lint / report-only CI job stays NON-BLOCKING until burn-down.
# - Local lint-new uses --new-from-merge-base=master on CLI only (G24).
# - Do NOT put issues.new-from-merge-base in this committed file.
#
# Cyclop test rule: max-complexity 15 globally; text exclusion on _test.go for
# scores 16-25 implements effective test max 25 (v2 has no per-path cyclop max).
# Scores >=26 still fail in tests; harness.go (non-_test.go) keeps prod max 15.

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  default: all
  disable:
    # Whitespace / layout: old wsl OFF (duplicate of wsl_v5); wsl_v5 now ON (A).
    - wsl
    # Import firewall without SSOT deny list (S17); gomodguard_v2 stays on via default:all.
    - depguard
    # Zero-value struct literal noise (~1308); not correctness.
    - exhaustruct
    # Blank-line-before-return style (~1240).
    - nlreturn
    # String repetition hints (~875); defer until baseline stable.
    - goconst
    # Inline error handling style enforcement (~711).
    - noinlineerr
    # Bans idiomatic short names in handlers/tests (~685).
    - varnamelen
    # Mandates t.Parallel() (~1409); corpus not ready.
    - paralleltest
    # Sentinel error naming style (~392).
    - err113
    # Line length (~201); not a correctness gate.
    - lll
    # Requires wrapping all external errors (~181); too strict for bootstrap.
    - wrapcheck
    # External test package layout (~155); conflicts with in-package tests.
    - testpackage
    # Go version uplift hints (~71); phase after green baseline.
    - modernize
    # Magic number literal bans (~69); noisy in HTTP status tests.
    - mnd
    # Function length (~49); overlaps cyclop complexity gates.
    - funlen
    # Package-level vars (~43); conflicts with architecture guard registries.
    - gochecknoglobals
    # Constructor/export ordering (~32).
    - funcorder
    # t.Helper() enforcement (~32).
    - thelper
    # Nested if depth (~24); overlaps cyclop.
    - nestif
    # Cognitive complexity (~35); redundant with cyclop.
    - gocognit
    # Deprecated import guard OFF; gomodguard_v2 is already on via default:all.
    - gomodguard
    # Prefer testing helpers (t.Setenv/t.TempDir); high churn in existing tests.
    - usetesting
    # Godoc comment style lint; docs burn-down deferred under bootstrap.
    - godoclint
    # Bans named returns; style noise across handlers and helpers.
    - nonamedreturns
    # Restricts returning interfaces; conflicts with DI and factory patterns.
    - ireturn
    # fmt.Sprintf vs strconv micro-opts; not a correctness gate.
    - perfsprint
    # Comment-ending punctuation style; pure cosmetics.
    - godot
    # Bans init(); conflicts with registry and package wiring patterns.
    - gochecknoinits
    # C: redundant complexity linter; cyclop is the sole complexity gate.
    - gocyclo

  settings:
    cyclop:
      max-complexity: 15
      package-average: 0
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: true
      verbose: true
      exclude-functions: []
    govet:
      enable-all: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    revive:
      enable-all-rules: false
      rules:
        - name: unused-parameter
        - name: error-return
        - name: indent-error-flow
        - name: var-naming
        - name: exported
          arguments:
            - disableStutteringCheck
    errchkjson:
      check-error-free-encoding: true
      report-no-exported: false
    nolintlint:
      require-explanation: true
      require-specific: true
    # B: enforce JSON struct tags to camelCase. Manual churn accepted.
    tagliatelle:
      case:
        rules:
          json: camel

  exclusions:
    generated: strict
    presets: []
    rules:
      - linters:
          - gosec
        text: "G104:"
      - path: _test\.go
        linters:
          - gosec
        text: "(G101|G306|G304|G107):"
      - path: internal/testsupport/
        linters:
          - gosec
        text: "(G101|G306|G304|G107):"
      - path: tests/integration/
        linters:
          - gosec
        text: "(G101|G306|G304|G107):"
      - path: internal/architecture/
        linters:
          - gosec
        text: "(G101|G306|G304|G107):"
      - path: _test\.go
        linters:
          - cyclop
        text: "is (1[6-9]|2[0-5]), max is 15"
      - path: _test\.go
        linters:
          - noctx
      - path: internal/testsupport/
        linters:
          - noctx
      - path: tests/integration/
        linters:
          - noctx
      - path: internal/architecture/
        linters:
          - noctx
      - path: internal/platform/crypto/
        linters:
          - canonicalheader
      - path: internal/platform/cache/memory/memory\.go
        linters:
          - revive
        text: "unused-parameter: parameter 'ctx'"

formatters:
  enable:
    - goimports
    - gofmt
  settings:
    goimports:
      local-prefixes:
        - github.com/MahdiBaghbani/opencloudmesh-go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

severity:
  default: error
  rules:
    - linters:
        - misspell
        - dupl
      severity: info

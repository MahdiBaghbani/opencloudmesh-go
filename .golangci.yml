#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

# Curated comprehensive lint bar for opencloudmesh-go (OCM strict server).
#
# Version pin: golangci-lint v2.12.2 (config verify exit 0).
#
# Enable/disable philosophy:
# - linters.default: all, then disable only documented noise buckets.
# - Correctness + security linters stay ON (errcheck explicit, gosec curated,
#   forcetypeassert, contextcheck, wastedassign, bodyclose, cyclop, etc.).
# - wsl_v5 ON (auto-fix via `make lint-fix`; accept churn). Old wsl OFF.
# - tagliatelle ON, json: camel (manual struct-tag churn; accept).
# - cyclop is the sole complexity linter (max 15). gocyclo OFF.
# - v2 has NO default exclusions: every exclusion is explicit (presets: []).
# - Do NOT use linters.exclusions.presets std-error-handling: it hides errcheck
#   Close/RemoveAll failures (~279 hits including prod HTTP clients).
#
# CI and local lint policy (not YAML keys):
# - CI: full-tree golangci-lint BLOCKS merges on any issue (ci.yml lint job).
# - Local make lint mirrors CI (full tree); make lint-new is delta-only via
#   --new-from-rev on the CLI (pinned LINT_BASE_REF in Makefile), not here.
# - Do NOT put issues.new-from-rev or new-from-merge-base in this file.
#
version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  default: all
  disable:
    # Whitespace / layout: old wsl OFF (duplicate of wsl_v5); wsl_v5 now ON.
    - wsl
    # Import firewall without SSOT deny list; gomodguard_v2 stays on via default:all.
    - depguard
    # Zero-value struct literal noise (~1308); not correctness.
    - exhaustruct
    # Blank-line-before-return style (~1240).
    - nlreturn
    # String repetition hints (~875); defer until baseline stable.
    - goconst
    # Inline error handling style enforcement (~711).
    - noinlineerr
    # Bans idiomatic short names in handlers/tests (~685).
    - varnamelen
    # Mandates t.Parallel() (~1409); corpus not ready.
    - paralleltest
    # Sentinel error naming style (~392).
    - err113
    # Line length (~201); not a correctness gate.
    - lll
    # Requires wrapping all external errors (~181); too strict for initial rollout.
    - wrapcheck
    # External test package layout (~155); conflicts with in-package tests.
    - testpackage
    # Go version uplift hints (~71); phase after green baseline.
    - modernize
    # Magic number literal bans (~69); noisy in HTTP status tests.
    - mnd
    # Function length (~49); overlaps cyclop complexity gates.
    - funlen
    # Package-level vars (~43); conflicts with architecture guard registries.
    - gochecknoglobals
    # Constructor/export ordering (~32).
    - funcorder
    # Nested if depth (~24); overlaps cyclop.
    - nestif
    # Cognitive complexity (~35); redundant with cyclop.
    - gocognit
    # Deprecated import guard OFF; gomodguard_v2 is already on via default:all.
    - gomodguard
    # Prefer testing helpers (t.Setenv/t.TempDir); high churn in existing tests.
    - usetesting
    # Godoc comment style lint; docs cleanup deferred until baseline is stable.
    - godoclint
    # Bans named returns; style noise across handlers and helpers.
    - nonamedreturns
    # Restricts returning interfaces; conflicts with DI and factory patterns.
    - ireturn
    # fmt.Sprintf vs strconv micro-opts; not a correctness gate.
    - perfsprint
    # Comment-ending punctuation style; pure cosmetics.
    - godot
    # Bans init(); conflicts with registry and package wiring patterns.
    - gochecknoinits
    # Redundant complexity linter; cyclop is the sole complexity gate.
    - gocyclo

  settings:
    cyclop:
      max-complexity: 15
      package-average: 0
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: true
      verbose: true
      exclude-functions: []
    govet:
      enable-all: true
      # fieldalignment reorders struct fields; for a wire-protocol library that
      # marshals OCM JSON in struct-definition order, reordering changes wire
      # output and breaks positional struct literals. Disabled; not auto-fixed.
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    revive:
      enable-all-rules: false
      rules:
        - name: unused-parameter
        - name: error-return
        - name: indent-error-flow
        - name: var-naming
        - name: exported
          arguments:
            - disableStutteringCheck
    errchkjson:
      check-error-free-encoding: true
      report-no-exported: false
    nolintlint:
      require-explanation: true
      require-specific: true
    # Enforce JSON struct tags to camelCase. Manual churn accepted.
    tagliatelle:
      case:
        rules:
          json: camel
    gosec:
      excludes:
        # G304: paths are config-controlled, not user input
        - G304
        # G306: 0644 is correct for public certs; private keys use 0600
        - G306
        # G104: best-effort cleanup; meaningful errors covered by errcheck
        - G104
        # G101: matches reason-code strings and test-fixture labels, not real secrets;
        # real secrets are env/config-injected
        - G101
        # G115: conversions are over fixed small values (lengths, argon2 params); no unbounded input
        - G115

  exclusions:
    generated: strict
    presets: []
    rules:
      - linters:
          - gosec
        text: "G104:"
      - path: internal/platform/crypto/
        linters:
          - canonicalheader
      - path: internal/platform/cache/memory/memory\.go
        linters:
          - revive
        text: "unused-parameter: parameter 'ctx'"

formatters:
  enable:
    - goimports
    - gofmt
  settings:
    goimports:
      local-prefixes:
        - github.com/MahdiBaghbani/opencloudmesh-go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

severity:
  default: error
  rules:
    - linters:
        - misspell
        - dupl
      severity: info

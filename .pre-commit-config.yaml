#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

# Local git hooks. Tool versions: make tools + Makefile pins.
# gofmt/goimports: staged Go files. go-vet: full module (index snapshot).
# go-mod-tidy: index check (CI fmt-vet).
# golangci-lint / go-test-unit: full module (make lint / make test-go).
# shellcheck: staged shell scripts. actionlint: GitHub workflows when staged.
# markdownlint: full tree via make. typos: full tree via make.
# hadolint: docker/Dockerfile via make. yamllint: non-workflow YAML via make.
# reuse: full-tree REUSE lint (make reuse-lint / CI reuse job).
minimum_pre_commit_version: "3.0.0"

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt (staged)
        entry: nu scripts/git/pre-commit-gofmt.nu
        language: system
        types: [go]
        pass_filenames: true

      - id: goimports
        name: goimports (staged)
        entry: nu scripts/git/pre-commit-goimports.nu
        language: system
        types: [go]
        pass_filenames: true

      - id: go-vet
        name: go vet (full module, index snapshot)
        entry: nu scripts/git/pre-commit-go-vet.nu
        language: system
        types: [go]
        pass_filenames: true
        require_serial: true

      - id: go-mod-tidy
        name: go mod tidy (index check)
        entry: nu scripts/git/pre-commit-go-mod-tidy.nu
        language: system
        pass_filenames: false
        require_serial: true

      - id: golangci-lint
        name: golangci-lint (full module)
        entry: golangci-lint
        args: [run, ./...]
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true

      - id: go-test-unit
        name: go test unit (full module, -race)
        entry: make
        args: [test-go]
        language: system
        pass_filenames: false
        require_serial: true

      - id: shellcheck
        name: shellcheck (staged shell scripts)
        entry: shellcheck
        args: [--]
        language: system
        types: [shell]
        pass_filenames: true

      - id: actionlint
        name: actionlint (github workflows)
        entry: actionlint
        language: system
        pass_filenames: false
        files: '^\.github/workflows/.*\.(yml|yaml)$'
        require_serial: true

      - id: markdownlint
        name: markdownlint (full tree, make markdownlint)
        entry: make
        args: [markdownlint]
        language: system
        types: [markdown]
        pass_filenames: false
        require_serial: true

      - id: typos
        name: typos (full tree, make typos)
        entry: make
        args: [typos]
        language: system
        pass_filenames: false
        require_serial: true

      - id: hadolint
        name: hadolint (docker/Dockerfile, make hadolint)
        entry: make
        args: [hadolint]
        language: system
        files: '^(docker/Dockerfile|\.hadolint\.yaml)$'
        pass_filenames: false
        require_serial: true

      - id: yamllint
        name: yamllint (non-workflow YAML, make yamllint)
        entry: make
        args: [yamllint]
        language: system
        types: [yaml]
        exclude: '^\.github/workflows/'
        pass_filenames: false
        require_serial: true

  - repo: https://codeberg.org/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        name: reuse lint
        pass_filenames: false

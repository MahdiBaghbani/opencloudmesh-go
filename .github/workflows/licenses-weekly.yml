#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

# Scheduled blocking license check. Fails on unknown/out-of-allowlist licenses.
# Not wired into ci.yml.

name: Licenses Weekly

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install go-licenses
        run: make licenses-install
      # Blocking: the Make target is strict. CI fails on unknown/out-of-allowlist licenses.
      - name: License check
        run: make licenses-check

#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

# Report-only at T+0; flip to a required blocking check via branch
# protection once the Security-tab baseline is clean (per W7/operator).
# Not wired into ci.yml so it does not block PR merge.

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install CGO build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install \
            --no-install-recommends --assume-yes \
            build-essential libsqlite3-dev
      # Manual CGO+sqlite build; autobuild cannot resolve this toolchain.
      - name: Build (CGO)
        env:
          CGO_ENABLED: '1'
        run: make build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: go
          # Fork PRs lack security-events:write on the base; skip SARIF upload.
          upload: >-
            ${{
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository)
              && 'true' || 'false'
            }}

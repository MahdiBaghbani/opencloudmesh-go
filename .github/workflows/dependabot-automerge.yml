#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

# Native GitHub auto-merge for Dependabot patch and minor bumps (both version
# and security updates). Major bumps are left for manual review. Auto-merge
# only fires after the required status checks configured on master (see
# branch protection) pass, so a Dependabot PR is never merged before CI is green.

name: Dependabot Automerge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: automerge
    # github.event.pull_request.user.login names the PR author and cannot be
    # spoofed via commit authorship; github.actor/triggering_actor reflect the
    # last actor on the triggering context and can (zizmor bot-conditions).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # gh pr merge / gh pr comment shell out to git to discover the repo,
    # which fails with "not a git repository" because this job has no
    # actions/checkout. GH_REPO makes gh resolve the repo via the API
    # instead, so no checkout is needed.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # Dependabot metadata tells us the semver level of the bump. For grouped
      # PRs this reports the highest level in the group. .github/dependabot.yml
      # groups minor+patch version updates and security updates separately.
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Dependabot omits update-type on many security PRs
      # (github.com/dependabot/fetch-metadata/issues/499), so derive the
      # semver level from the versions when update-type is absent. Auto-merge
      # covers patch and minor (version or security); major stays manual.
      - name: Classify bump level
        id: level
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          PREV: ${{ steps.meta.outputs.previous-version }}
          NEW: ${{ steps.meta.outputs.new-version }}
        run: |
          set -euo pipefail
          level=""
          case "$UPDATE_TYPE" in
            version-update:semver-patch) level="patch" ;;
            version-update:semver-minor) level="minor" ;;
            version-update:semver-major) level="major" ;;
          esac
          if [ -z "$level" ] && [ -n "$PREV" ] && [ -n "$NEW" ]; then
            prev="${PREV#v}"; new="${NEW#v}"
            if [ "${new%%.*}" != "${prev%%.*}" ]; then
              level="major"
            else
              prev_mm="${prev#*.}"; new_mm="${new#*.}"
              if [ "${new_mm%%.*}" != "${prev_mm%%.*}" ]; then
                level="minor"
              else
                level="patch"
              fi
            fi
          fi
          echo "level=${level}" >> "$GITHUB_OUTPUT"
          if [ "$level" = "patch" ] || [ "$level" = "minor" ]; then
            echo "automerge=true" >> "$GITHUB_OUTPUT"
          else
            echo "automerge=false" >> "$GITHUB_OUTPUT"
          fi

      # Queue a squash auto-merge for patch and minor bumps. GitHub holds the
      # merge until required status checks pass and the PR is mergeable.
      - name: Enable auto-merge
        if: steps.level.outputs.automerge == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      # Major bumps (version or security) can break the build; keep manual.
      # Unknown levels also fall here and stay manual.
      - name: Comment on manual-review bump
        if: steps.level.outputs.automerge != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "Left for manual review. Auto-merge is enabled only for patch and minor bumps."

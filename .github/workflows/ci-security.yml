#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  govulncheck:
    uses: ./.github/workflows/ci-security-govulncheck.yml
  gosec:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-security-gosec.yml
  zizmor:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-security-zizmor.yml

#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump kind
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: minor

# Workflow-level permissions stay minimal; jobs that need write scope declare
# it themselves (zizmor excessive-permissions).
permissions:
  contents: read

env:
  # Pinned changie release; update together with changelog-check.yml.
  CHANGIE_VERSION: v1.25.1
  GOLANGCI_LINT_VERSION: v2.12.2
  NU_VERSION: 0.114.1

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # contents: write is required for the DCO-signed commit, tag, and push.
    # GitHub Release creation is owned by the binary (GoReleaser) lane.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # Push auth is re-established explicitly in the push step below.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install changie
        run: go install "github.com/miniscruff/changie@${CHANGIE_VERSION}"

      # Pass bump kind only (never a version string) so changie owns the next tag.
      - name: Batch changelog fragments
        run: changie batch "${{ inputs.bump }}"

      # changie latest returns the v-prefixed version; use it verbatim as the tag.
      - name: Resolve release version
        id: version
        run: version="$(changie latest)"; printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Merge changelog
        run: changie merge

      - name: Configure git identity
        run: git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stage release changes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git add CHANGELOG.md ".changes/${VERSION}.md" .changes/unreleased

      # -s adds the Signed-off-by trailer the repo commit policy requires.
      - name: Commit release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: 'git commit -s -m "chore(release): ${VERSION}"'

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - uses: ./.github/actions/install-nushell
        with:
          nu-version: ${{ env.NU_VERSION }}

      - name: Verify immutable action pins
        run: make verify-action-pins

      - name: Tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git tag -a "${VERSION}" -m "Release ${VERSION}"

      - name: Push release commit and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # persist-credentials is off, so authenticate pushes explicitly.
          # The token never hits logs: nothing here echoes the URL (no set -x)
          # and Actions masks the GITHUB_TOKEN value in git's push output.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --atomic origin HEAD:"${GITHUB_REF#refs/heads/}" "${{ steps.version.outputs.version }}"

  binary:
    name: binary
    needs: release
    # The called workflow can only maintain or downgrade this token, so the
    # binary release and attestation permissions must be granted here.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-binary.yml
    with:
      tag: ${{ needs.release.outputs.version }}

  image:
    name: image
    needs: release
    # The called workflow can only maintain or downgrade this token, so the
    # image publish and attestation permissions must be granted here.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # GITHUB_TOKEN is a reserved secret name and cannot be declared in
    # `on.workflow_call.secrets`; every job (including reusable-workflow
    # calls) already receives its own ephemeral GITHUB_TOKEN automatically,
    # so it is not passed through here.
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
      semver: ${{ needs.release.outputs.version }}

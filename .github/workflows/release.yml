#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump kind
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: minor

# Workflow-level permissions stay minimal; jobs that need write scope declare
# it themselves (zizmor excessive-permissions).
permissions:
  contents: read

env:
  # Pinned changie release; update together with policy-changelog-check.yml.
  CHANGIE_VERSION: v1.25.1
  GOLANGCI_LINT_VERSION: v2.12.2
  NU_VERSION: 0.114.1
  # Pinned gitsign release; used to keyless-sign the release commit (Sigstore).
  # The release tag is created by release-finalize.yml after the PR merges.
  GITSIGN_VERSION: v0.17.1

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # contents: write is required to push the release branch and open the PR.
    # id-token: write is required for gitsign keyless (Sigstore) commit signing.
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      pr_url: ${{ steps.pr.outputs.PR_URL }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # Push auth is re-established explicitly in the push step below.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          # cache disabled to silence zizmor cache-poisoning; release builds are one-off
          cache: false

      - name: Install changie
        run: go install "github.com/miniscruff/changie@${CHANGIE_VERSION}"

      # Pass bump kind only (never a version string) so changie owns the next tag.
      - name: Batch changelog fragments
        run: changie batch "${{ inputs.bump }}"

      # changie latest returns the v-prefixed version; use it verbatim as the tag.
      - name: Resolve release version
        id: version
        run: version="$(changie latest)"; printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Merge changelog
        run: changie merge

      - name: Configure git identity
        run: git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install gitsign
        run: go install "github.com/sigstore/gitsign@${GITSIGN_VERSION}"

      # Sign the release commit with gitsign keyless (Sigstore X.509) so it
      # satisfies the master "require signed commits" rule after the PR merges.
      - name: Configure gitsign for commit signing
        run: |
          git config gpg.format x509
          git config gpg.x509.program gitsign
          git config commit.gpgsign true

      - name: Stage release changes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git add CHANGELOG.md ".changes/${VERSION}.md" .changes/unreleased

      # -s adds the Signed-off-by trailer the repo commit policy requires.
      - name: Commit release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: 'git commit -s -S -m "chore(release): ${VERSION}"'

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      # Dynamic analysis before release: the Go race detector (go test -race)
      # and the fuzz targets (Makefile FUZZ_TARGETS) assert parser invariants
      # at run time. This is the release-time dynamic analysis gate; see
      # docs/assurance-case.md and the `fuzz` target in the Makefile.
      - name: Dynamic analysis (race detector + fuzz)
        run: |
          make test-go
          make fuzz FUZZ_TIME=60s

      - uses: ./.github/actions/install-nushell
        with:
          nu-version: ${{ env.NU_VERSION }}

      - name: Verify immutable action pins
        run: make verify-action-pins

      # master is protected (require signed commits + require PR + status
      # checks + enforce_admins), so the signed release commit cannot be
      # pushed directly. Push it on a release branch and open a PR; GitHub
      # signs the merge commit, satisfying "require signed commits".
      - name: Push release branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          git checkout -b "${BRANCH}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -u origin "${BRANCH}"

      - name: Open release pull request
        id: pr
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr create \
            --base "${GITHUB_REF#refs/heads/}" \
            --head "release/${VERSION}" \
            --title "chore(release): ${VERSION}" \
            --body "Batched changelog for ${VERSION}. Merge to publish; the finalize lane tags and builds on merge.")"
          echo "PR_URL=${PR_URL}" >> "$GITHUB_OUTPUT"
          # Auto-merge is a convenience; if it is not enabled for the repo the
          # operator can merge the PR manually and finalize still runs on push.
          gh pr merge --auto --merge "${PR_URL}" || \
            echo "auto-merge not available; merge ${PR_URL} manually"

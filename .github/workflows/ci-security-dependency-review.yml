#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI Dependency Review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            Apache-2.0, BSD-2-Clause, BSD-3-Clause, MIT, ISC, MPL-2.0,
            LGPL-2.1-or-later, LGPL-3.0-or-later, GPL-2.0-only,
            GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later, Unlicense, 0BSD, Zlib,
            LicenseRef-scancode-google-patent-license-golang

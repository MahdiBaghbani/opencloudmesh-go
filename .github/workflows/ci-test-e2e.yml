#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI Test E2E

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: read
  pull-requests: read

env:
  # Pinned Bun release (npm/GitHub latest at pin time: bun-v1.3.14).
  BUN_VERSION: 1.3.14
  # From oven-sh/bun release asset SHASUMS256.txt for bun-linux-x64.zip.
  BUN_LINUX_X64_SHA256: 951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f
  NU_VERSION: 0.114.1

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.apply.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        with:
          filters: |
            e2e:
              - 'tests/e2e/**'
              - 'tests/ca_pool/**'
              - 'internal/**'
              - 'cmd/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci-test-e2e.yml'
      - uses: ./.github/actions/install-nushell
        with:
          nu-version: ${{ env.NU_VERSION }}
      - id: apply
        env:
          EVENT: ${{ github.event_name }}
          FILTERED: ${{ steps.filter.outputs.e2e }}
        run: nu .github/scripts/e2e-changes.nu

  e2e:
    name: e2e
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    permissions:
      contents: read
      pull-requests: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Bun
        run: |
          set -euo pipefail
          archive="bun-linux-x64.zip"
          url="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/${archive}"
          curl -fsSL "$url" -o "/tmp/${archive}"
          echo "${BUN_LINUX_X64_SHA256}  /tmp/${archive}" | sha256sum -c -
          rm -rf /tmp/bun-extract
          mkdir -p /tmp/bun-extract
          unzip -q -o "/tmp/${archive}" -d /tmp/bun-extract
          mkdir -p "$HOME/.bun/bin"
          install -m 755 "/tmp/bun-extract/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          ln -s "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
          echo "$HOME/.bun/bin" >> "${GITHUB_PATH}"
          "$HOME/.bun/bin/bun" --version
      - name: Install E2E dependencies
        run: make test-e2e-install
      - name: Run E2E tests
        run: make test-e2e
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Playwright traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-test-results
          path: tests/e2e/test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish JUnit test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Playwright E2E results
          path: tests/e2e/test-results/junit.xml
          reporter: java-junit
          fail-on-empty: false
        continue-on-error: true

  e2e-result:
    name: e2e-result
    needs: [changes, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/install-nushell
        with:
          nu-version: ${{ env.NU_VERSION }}
      - name: Report e2e result
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.e2e.result }}
        run: nu .github/scripts/e2e-result.nu

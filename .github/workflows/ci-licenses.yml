#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI Licenses

on:
  workflow_call:

permissions:
  contents: read

jobs:
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install go-licenses
        run: make licenses-install
      - name: License tree
        run: make licenses
      # Report-only at T+0; single suppression layer is this step's continue-on-error (NOT a Make `-` prefix). W7 flips CI to blocking by removing this continue-on-error.
      - name: License check (report-only)
        run: make licenses-check
        continue-on-error: true
      - name: Save NOTICE and LICENSES
        run: make licenses-save
      - name: Upload licenses-notices artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: licenses-notices
          path: bin/licenses/
          if-no-files-found: error

#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI Changelog

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

env:
  # Pinned changie release; update together with the install step below.
  CHANGIE_VERSION: v1.25.1
  NU_VERSION: 0.114.1

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/install-nushell
        with:
          nu-version: ${{ env.NU_VERSION }}

      # Positive user-facing path set. The changelog job always runs (required
      # check name `changelog`); skip is a step output, not a skipped job.
      # Pinned dorny/paths-filter SHA matches .github/action-pins.yml.
      - id: product
        name: Detect user-facing paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            product:
              - 'cmd/**'
              - 'internal/**'
              - '!internal/architecture/**'
              - '!internal/testsupport/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'docker/**'
              - 'scripts/build-docker.sh'
              - '.goreleaser.yaml'
              - 'assets/**'
              - 'README.md'
              - 'SECURITY.md'
              - '.github/workflows/release.yml'
              - '.github/workflows/release-binary.yml'
              - '.github/workflows/release-finalize.yml'
              - '.github/workflows/docker-build.yml'
              - '.github/actions/build-go/**'

      - name: Test skip script
        run: nu .github/scripts/changelog-skip-check-test.nu

      # Skip the gate for dependabot, release PRs, skip-changelog, or PRs
      # with no user-facing path changes. The step always exits 0 on a
      # successful decision and emits a `skip` output that gates later
      # steps, so skipped PRs do not run the fragment gate.
      - id: skip
        name: Skip check
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PRODUCT_CHANGED: ${{ steps.product.outputs.product }}
        run: nu .github/scripts/changelog-skip-check.nu

      # When the gate is skipped (release PR, dependabot, skip-changelog
      # label, or no user-facing paths), remove any prior reminder comment
      # so it does not linger.
      - if: steps.skip.outputs.skip == 'true'
        name: Remove changelog reminder
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: changie-reminder
          delete: true

      # Require at least one changie fragment under .changes/unreleased/.
      - if: steps.skip.outputs.skip != 'true'
        name: Check for changelog fragment
        uses: brettcannon/check-for-changed-files@d85c64d17b3c1d0ac57c9cc46ea39399b0d6fa71
        with:
          file-pattern: |
            .changes/unreleased/*.yaml
          failure-message: "Missing a changelog fragment under ${file-pattern}; add one with 'changie new' or apply the skip-changelog label"
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - if: steps.skip.outputs.skip != 'true'
        name: Install changie
        run: go install "github.com/miniscruff/changie@${CHANGIE_VERSION}"

      # Validate fragments are well-formed. A malformed fragment must fail.
      # `changie batch` requires a bump argument; `auto` derives the bump
      # from each fragment's kind `auto` field (see .changie.yaml kinds).
      - if: steps.skip.outputs.skip != 'true'
        name: Validate fragments
        continue-on-error: false
        run: changie batch auto --dry-run

      # On failure, post the contributor guide as a sticky PR comment. The
      # action creates or updates the comment identified by `header`, so
      # re-runs update the same comment instead of posting new ones. The
      # guide text lives in .github/messages/changelog-reminder.md so it can be edited
      # and previewed as plain markdown.
      - if: failure() && steps.skip.outputs.skip != 'true'
        name: Post changelog instructions
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: changie-reminder
          path: .github/messages/changelog-reminder.md
          skip_unchanged: true

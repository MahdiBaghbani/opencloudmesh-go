#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fmt-vet:
    uses: ./.github/workflows/ci-lint-fmt-vet.yml
  golangci:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    uses: ./.github/workflows/ci-lint-golangci.yml
  actionlint:
    uses: ./.github/workflows/ci-lint-actionlint.yml
  markdownlint:
    uses: ./.github/workflows/ci-lint-rumdl.yml
  typos:
    uses: ./.github/workflows/ci-lint-typos.yml
  hadolint:
    uses: ./.github/workflows/ci-lint-hadolint.yml
  yamllint:
    uses: ./.github/workflows/ci-lint-yamllint.yml
  shellcheck:
    uses: ./.github/workflows/ci-lint-shellcheck.yml

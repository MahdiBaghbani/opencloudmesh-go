#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI Lint

on:
  workflow_call:
    inputs:
      job:
        description: Which lint job to run (fmt-vet, lint, or shellcheck)
        required: true
        type: string

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOIMPORTS_VERSION: v0.30.0

jobs:
  validate-job:
    name: validate job input
    runs-on: ubuntu-latest
    steps:
      - name: Reject unknown job input
        env:
          JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          case "$JOB" in
            fmt-vet|lint|shellcheck) ;;
            *)
              echo "Invalid inputs.job: ${JOB}" >&2
              echo "Allowed: fmt-vet, lint, shellcheck" >&2
              exit 1
              ;;
          esac

  fmt-vet:
    name: fmt + vet
    if: inputs.job == 'fmt-vet'
    needs: validate-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@${{ env.GOIMPORTS_VERSION }}
      - name: Verify formatting
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  lint:
    name: golangci-lint
    if: inputs.job == 'lint'
    needs: validate-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      # Full-tree lint gate: baseline is clean, so CI blocks on any issue.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  shellcheck:
    name: shellcheck
    if: inputs.job == 'shellcheck'
    needs: validate-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo mv "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: shellcheck
        run: make shellcheck

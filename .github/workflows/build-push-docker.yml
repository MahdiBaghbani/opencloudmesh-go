#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: Build and Push Docker

on:
  # push:tags is a fallback for human-pushed tags only. release.yml calls this
  # via workflow_call, because GITHUB_TOKEN-pushed tags do not trigger on:push.
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:
    inputs:
      semver:
        description: Semver image tag (example v1.2.3)
        required: true
        type: string
  workflow_call:
    inputs:
      semver:
        description: Semver image tag (example v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mahdibaghbani/opencloudmesh-go
  NU_VERSION: 0.114.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_call' && inputs.semver || '' }}
          persist-credentials: false

      - uses: ./.github/actions/install-nushell
        with:
          nu-version: ${{ env.NU_VERSION }}

      - name: Resolve semver tag
        id: meta
        env:
          DISPATCH_SEMVER: ${{ inputs.semver }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
        run: nu .github/scripts/resolve-semver-tag.nu

      - name: setup buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: login ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            OCM_IMAGE_VERSION=${{ steps.meta.outputs.semver_tag }}
            OCM_IMAGE_REVISION=${{ steps.meta.outputs.full_sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.semver_tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          provenance: mode=max
          sbom: true

      - name: Publish digest manifest
        id: digest_manifest
        env:
          SEMVER_TAG: ${{ steps.meta.outputs.semver_tag }}
          FULL_SHA: ${{ steps.meta.outputs.full_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE }}
        run: nu .github/scripts/digest-manifest.nu

      - name: Upload digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docker-digest-manifest-${{ steps.meta.outputs.semver_tag }}
          path: ${{ steps.digest_manifest.outputs.manifest_path }}
          if-no-files-found: error

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Report-only: continue-on-error suppresses CRITICAL failures; flip to blocking by removing continue-on-error once the image has zero CRITICAL findings.
      - name: Scan image for CRITICAL vulnerabilities (report-only)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

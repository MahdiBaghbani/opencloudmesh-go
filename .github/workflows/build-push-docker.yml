#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: Build and Push Docker

on:
  # push:tags is a fallback for human-pushed tags only. release.yml calls this
  # via workflow_call, because GITHUB_TOKEN-pushed tags do not trigger on:push.
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:
    inputs:
      semver:
        description: Semver image tag (example v1.2.3)
        required: true
        type: string
  workflow_call:
    inputs:
      semver:
        description: Semver image tag (example v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mahdibaghbani/opencloudmesh-go

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_call' && inputs.semver || '' }}
          persist-credentials: false

      - name: Resolve semver tag
        id: meta
        env:
          DISPATCH_SEMVER: ${{ inputs.semver }}
        run: |
          set -eu
          semver_ok() {
            # Core: no leading zeros. Prerelease ids: 0 | [1-9][0-9]* | alnum/hyphen with a letter/hyphen.
            # Build metadata (+...) rejected. Same check for workflow_dispatch, workflow_call, and tag push.
            local id='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
            [[ "$1" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${id}(\.${id})*)?$ ]]
          }
          # Runner-provided env vars (not template interpolation) keep this
          # run block free of expression expansion (zizmor template-injection).
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_call" ]; then
            if [ -z "${DISPATCH_SEMVER}" ]; then
              echo "workflow_dispatch/workflow_call requires inputs.semver"
              exit 1
            fi
            SEMVER_TAG="${DISPATCH_SEMVER}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            SEMVER_TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "Ref ${GITHUB_REF} does not carry a semver tag"
            exit 1
          fi
          if ! semver_ok "${SEMVER_TAG}"; then
            echo "Invalid semver tag: ${SEMVER_TAG}"
            exit 1
          fi
          FULL_SHA="$(git rev-parse HEAD)"
          {
            echo "semver_tag=${SEMVER_TAG}"
            echo "full_sha=${FULL_SHA}"
            echo "sha_tag=sha-${FULL_SHA}"
          } >> "${GITHUB_OUTPUT}"
          echo "SEMVER_TAG=${SEMVER_TAG}"
          echo "GITHUB_SHA=${FULL_SHA}"

      - name: setup buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: login ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            OCM_IMAGE_VERSION=${{ steps.meta.outputs.semver_tag }}
            OCM_IMAGE_REVISION=${{ steps.meta.outputs.full_sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.semver_tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}

      - name: Publish digest manifest
        id: digest_manifest
        env:
          SEMVER_TAG: ${{ steps.meta.outputs.semver_tag }}
          FULL_SHA: ${{ steps.meta.outputs.full_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -eu
          if [ -z "${IMAGE_DIGEST}" ]; then
            echo "Missing image digest from build-push step"
            exit 1
          fi
          MANIFEST="digest-manifest-${SEMVER_TAG}-${FULL_SHA}.json"
          printf '%s\n' \
            "{" \
            "  \"image\": \"${IMAGE}\"," \
            "  \"semver_tag\": \"${SEMVER_TAG}\"," \
            "  \"commit_sha\": \"${FULL_SHA}\"," \
            "  \"sha_tag\": \"sha-${FULL_SHA}\"," \
            "  \"digest\": \"${IMAGE_DIGEST}\"" \
            "}" > "${MANIFEST}"
          cat "${MANIFEST}"
          echo "manifest_path=${MANIFEST}" >> "${GITHUB_OUTPUT}"

      - name: Upload digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docker-digest-manifest-${{ steps.meta.outputs.semver_tag }}
          path: ${{ steps.digest_manifest.outputs.manifest_path }}
          if-no-files-found: error

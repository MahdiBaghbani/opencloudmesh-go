#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    uses: ./.github/workflows/ci-lint.yml

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-security.yml

  licenses:
    uses: ./.github/workflows/ci-licenses.yml

  test:
    uses: ./.github/workflows/ci-test.yml

  build:
    uses: ./.github/workflows/ci-build.yml

  pins:
    uses: ./.github/workflows/ci-pins.yml

  reuse:
    uses: ./.github/workflows/ci-reuse.yml

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, security, licenses, test, build, pins, reuse]
    if: ${{ !cancelled() }}
    env:
      NU_VERSION: 0.114.1
      LINT_RESULT: ${{ needs.lint.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      LICENSES_RESULT: ${{ needs.licenses.result }}
      TEST_RESULT: ${{ needs.test.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      PINS_RESULT: ${{ needs.pins.result }}
      REUSE_RESULT: ${{ needs.reuse.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/install-nushell
        with:
          nu-version: ${{ env.NU_VERSION }}
      - name: Parity check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: nu .github/scripts/ci-parity-check.nu
      # Require every listed CI job result to be success (see ci-require-jobs.nu).
      - name: Require blocking jobs
        run: nu .github/scripts/ci-require-jobs.nu

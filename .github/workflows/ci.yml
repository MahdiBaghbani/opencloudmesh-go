#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-vet:
    uses: ./.github/workflows/ci-lint.yml
    with:
      job: fmt-vet

  lint:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    uses: ./.github/workflows/ci-lint.yml
    with:
      job: lint

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-security.yml
    with:
      job: security

  test:
    uses: ./.github/workflows/ci-test.yml
    with:
      job: test

  build:
    uses: ./.github/workflows/ci-test.yml
    with:
      job: build

  action-pins:
    name: action-pins
    runs-on: ubuntu-latest
    env:
      NU_VERSION: 0.114.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Nushell
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/nushell/nushell/releases/download/${{ env.NU_VERSION }}/nu-${{ env.NU_VERSION }}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/nu.tar.gz
          tar -xzf /tmp/nu.tar.gz -C /tmp
          sudo mv "/tmp/nu-${{ env.NU_VERSION }}-x86_64-unknown-linux-gnu/nu" /usr/local/bin/nu
          nu --version
      - name: Verify immutable action pins
        run: make verify-action-pins

  reuse:
    name: reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      # Blocking REUSE gate: any missing copyright/licensing info fails CI.
      - name: Sync dev dependencies
        run: uv sync
      - name: REUSE lint
        run: uv run reuse lint

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [fmt-vet, lint, security, test, build, action-pins, reuse]
    if: always()
    steps:
      - name: Require blocking jobs
        run: |
          test "${{ needs.fmt-vet.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.action-pins.result }}" = "success"
          # Security required: blocking gosec gates CI; govulncheck stays report-only.
          test "${{ needs.security.result }}" = "success"
          test "${{ needs.reuse.result }}" = "success"

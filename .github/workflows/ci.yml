name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOIMPORTS_VERSION: v0.30.0

jobs:
  fmt-vet:
    name: fmt + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@${{ env.GOIMPORTS_VERSION }}
      - name: Verify formatting
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      # Full-tree lint gate: baseline is clean, so CI blocks on any issue.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      # Report-only until toolchain pin, module bumps, and govulncheck reach zero.
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f
        with:
          go-version-file: go.mod
        continue-on-error: true
      - name: Install golangci-lint for SARIF
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      # Blocking gosec gate: baseline is clean, so findings fail CI.
      - name: gosec SARIF (golangci-lint)
        run: |
          golangci-lint run --enable-only=gosec \
            --output.sarif.path=gosec.sarif ./...
      - name: Upload gosec SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          sarif_file: gosec.sarif
          category: gosec

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests with coverage
        run: make test-go
      - name: Integration tests with coverage
        run: make test-integration
      - name: Verify coverage artifact names
        run: |
          test -f coverage-unit.out
          test -f coverage-integration.out
      - name: Upload coverage profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-profiles
          path: |
            coverage-unit.out
            coverage-integration.out
          if-no-files-found: error

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: make build

  action-pins:
    name: action-pins
    runs-on: ubuntu-latest
    env:
      NU_VERSION: 0.114.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Nushell
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/nushell/nushell/releases/download/${{ env.NU_VERSION }}/nu-${{ env.NU_VERSION }}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/nu.tar.gz
          tar -xzf /tmp/nu.tar.gz -C /tmp
          sudo mv "/tmp/nu-${{ env.NU_VERSION }}-x86_64-unknown-linux-gnu/nu" /usr/local/bin/nu
          nu --version
      - name: Verify immutable action pins
        run: make verify-action-pins

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [fmt-vet, lint, security, test, build, action-pins]
    if: always()
    steps:
      - name: Require blocking jobs
        run: |
          test "${{ needs.fmt-vet.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.action-pins.result }}" = "success"
          # Security required: blocking gosec gates CI; govulncheck stays report-only.
          test "${{ needs.security.result }}" = "success"

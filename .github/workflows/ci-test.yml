#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests with coverage
        run: make test-go
      - name: Integration tests with coverage
        run: make test-integration
      - name: Verify coverage artifact names
        run: test -f coverage-unit.out && test -f coverage-integration.out
      - name: Upload coverage profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-profiles
          path: |
            coverage-unit.out
            coverage-integration.out
          if-no-files-found: error
      - name: Upload unit coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: coverage-unit.out
          format: golang
          flag-name: unit
          parallel: true
        continue-on-error: true
      - name: Upload integration coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: coverage-integration.out
          format: golang
          flag-name: integration
          parallel: true
        continue-on-error: true
  finish:
    name: coveralls-finish
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Close Coveralls parallel build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          parallel-finished: true
          carryforward: "unit,integration"
        continue-on-error: true

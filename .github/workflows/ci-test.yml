#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

name: CI Test

on:
  workflow_call:
    inputs:
      job:
        description: Which test job to run (test or build)
        required: true
        type: string

jobs:
  validate-job:
    name: validate job input
    runs-on: ubuntu-latest
    steps:
      - name: Reject unknown job input
        env:
          JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          case "$JOB" in
            test|build) ;;
            *)
              echo "Invalid inputs.job: ${JOB}" >&2
              echo "Allowed: test, build" >&2
              exit 1
              ;;
          esac

  test:
    name: test
    if: inputs.job == 'test'
    needs: validate-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests with coverage
        run: make test-go
      - name: Integration tests with coverage
        run: make test-integration
      - name: Verify coverage artifact names
        run: |
          test -f coverage-unit.out
          test -f coverage-integration.out
      - name: Upload coverage profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-profiles
          path: |
            coverage-unit.out
            coverage-integration.out
          if-no-files-found: error

  build:
    name: build
    if: inputs.job == 'build'
    needs: validate-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: make build

#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.
#
# Dependabot config: gomod for Go modules; uv for dev Python tools (pre-commit,
# reuse) in pyproject.toml / uv.lock. github-actions is intentionally omitted because
# verify-action-pins uses .github/action-pins.yml as the SSOT; a Dependabot
# workflow SHA update would not update that file. docker is intentionally omitted
# because docker/Dockerfile uses ARG-based FROM, which dependabot-core issue #2057
# cannot resolve; adding it would be a no-op and falsely signal coverage.

version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      go-modules:
        update-types:
          - minor
          - patch
      # Security bumps group separately from version bumps so a CVE fix never
      # waits behind a routine minor/patch rollup (and vice versa).
      security:
        applies-to: security-updates
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dev-tools:
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
    commit-message:
      prefix: "build(deps-dev)"

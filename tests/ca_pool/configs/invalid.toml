#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

# Config for manual validation: invalid tls_root_ca_file fails at startup.
# Run from repo root: go run ./cmd/opencloudmesh-go -config tests/ca_pool/configs/invalid.toml
mode = "dev"
listen_addr = ":0"
public_origin = "http://localhost:0"

[outbound_http]
tls_root_ca_file = "/nonexistent/ca-does-not-exist.pem"

[outbound_http.ssrf]
mode = "off"

#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

mode = "strict"
listen_addr = ":443"

[tls]
mode = "static"
cert_file = "/tls/ocm-go.crt"
key_file = "/tls/ocm-go.key"

[outbound_http]
tls_root_ca_file = "/tls/certificate-authority/dockypody.crt"

#
# OpenCloudMesh Go - a runnable Open Cloud Mesh peer in Go, focused on a strict, WebDAV-centered subset of the protocol.

# GoReleaser v2 config for binary release archives.
# Release notes come from --release-notes=.changes/<tag>.md (no changelog: key).
version: 2

before:
  hooks:
    # Download only: go mod tidy dirties the tag checkout and aborts the run.
    - go mod download

gomod:
  proxy: false

builds:
  - id: opencloudmesh-go
    main: ./cmd/opencloudmesh-go
    binary: opencloudmesh-go
    env:
      - CGO_ENABLED=0
    # Reproducible builds: pin the binary file mtime to the commit timestamp so
    # release archives are byte-identical across machines. -trimpath strips
    # absolute build paths; -s -w strips symbols; the toolchain is pinned by
    # go.mod. See docs/reproducible-builds.md.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Pin the binary's archive-entry mtime to the commit date so archives are
    # byte-identical regardless of when they are built. The binary's embedded
    # mtime is pinned by builds.mod_timestamp above.
    builds_info:
      mtime: "{{ .CommitDate }}"
    # Binary is included automatically. Notices: curated index, REUSE SQLite
    # text, and the go-licenses tree prepared by make licenses-save
    # (paths keep bin/licenses/ so modernc module dirs stay nested). Each
    # bundled file's mtime is pinned to the commit date for reproducibility.
    files:
      - src: LICENSE-3RD-PARTY.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: LICENSES/LicenseRef-SQLite-Public-Domain.txt
        info:
          mtime: "{{ .CommitDate }}"
      - src: bin/licenses/**/*
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Cosign keyless signing of release artifacts (Sigstore). The release workflow
# installs cosign and supplies the OIDC token via id-token: write; cosign
# records the signature in Rekor and writes a .sigstore.json bundle per
# artifact, which GoReleaser attaches to the GitHub Release. No long-lived key.
# Verify with `cosign verify-blob --bundle <file>.sigstore.json <file>`; see
# docs/verification.md. artifacts: all signs every archive plus the checksum
# manifest (best for the OpenSSF Scorecard signed-releases check).
signs:
  - id: cosign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: all
    output: true

release:
  prerelease: auto
  mode: replace
  replace_existing_artifacts: true
